name: Nightly refresh and deploy

on:
  schedule:
    - cron: "41 8 * * *"   # daily, 08:41 UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_igdb:
        description: "Re-fetch IGDB facts for every game"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data
        if: github.event_name != 'push'
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          python3 collector/wikipedia.py
          if [ "${{ inputs.refresh_igdb }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            python3 collector/igdb_match.py --refresh
          else
            python3 collector/igdb_match.py
          fi
      - name: Refresh trailers and Game Pass
        if: github.event_name != 'push'
        continue-on-error: true   # a broken Microsoft/YouTube feed keeps yesterday's data rather than failing the deploy
        run: python3 collector/media.py
      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "crossplay-bot"
          git config user.email "209829115+bigfootsbestfriend@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Nightly data refresh $(date -u +%F)"
          git push
      - name: Build site
        run: python3 site/build.py
      - name: List pages that changed (compared with the live site, before deploying)
        id: changed
        continue-on-error: true
        run: |
          python3 site/indexnow.py diff > changed.txt
          echo "$(wc -l < changed.txt) changed pages"
          { echo "urls<<EOF"; cat changed.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        if: needs.build.outputs.changed != ''
      - name: Tell IndexNow (Bing and others) about changed pages
        if: needs.build.outputs.changed != ''
        continue-on-error: true
        env:
          CHANGED: ${{ needs.build.outputs.changed }}
        run: printf '%s\n' "$CHANGED" | python3 site/indexnow.py ping
