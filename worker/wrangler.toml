# Community API for the Crossplay Guide: crossplay votes and moderated player tips.
# Deploy: npx wrangler deploy   (see worker/README.md)
name = "crossplay-community"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Each new review/report is emailed here (needs the RESEND_API_KEY secret).
OWNER_EMAIL = "mike@thekitchenmagpie.com"
# Pages allowed to call the API (comma-separated origins).
ALLOWED_ORIGINS = "https://crossplayguide.com,https://www.crossplayguide.com,https://bigfootsbestfriend.github.io,http://localhost:8000"
SITE_URL = "https://crossplayguide.com"

[[d1_databases]]
binding = "DB"
database_name = "crossplay-community"
database_id = "35295391-a1b8-4323-9bd9-71c45b985d7b"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   ADMIN_PASSWORD    password for /admin (user name: admin)
#   HASH_SALT         any long random string; makes the stored IP hashes unguessable
#   TURNSTILE_SECRET  optional; when set, tips must pass Cloudflare Turnstile
